name: 'Continuous integration'
on: ['push', 'pull_request']
jobs:
  cs:
    runs-on: 'ubuntu-24.04'
    name: 'Coding style'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' # v4.4.0

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962' # 2.40.0
        with:
          php-version: '8.1'
          coverage: 'none'
          extensions: 'json, mbstring, tokenizer'
          tools: 'composer-normalize:2.54.0, php-cs-fixer:3.84.0'

      - name: 'Check PHP code'
        run: |
          php-cs-fixer fix --diff --dry-run --allow-risky=yes --using-cache=no --show-progress=dots

      - name: 'Check composer.json'
        run: |
          composer-normalize --diff --dry-run --indent-size=4 --indent-style=space --no-update-lock

      - name: 'Check editorconfig'
        run: |
          curl -fsSL -o /tmp/editorconfig-checker.tar.gz https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v4.0.2/editorconfig-checker-linux-amd64.tar.gz
          echo '44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003  /tmp/editorconfig-checker.tar.gz' | sha256sum --check
          tar -xzf /tmp/editorconfig-checker.tar.gz -C /tmp editorconfig-checker
          /tmp/editorconfig-checker

  coding-standards:
    runs-on: 'ubuntu-24.04'
    name: 'Coding standards'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' # v4.4.0

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962' # 2.40.0
        with:
          php-version: '8.1'
          tools: composer

      - name: 'Install dependencies with Composer'
        uses: 'ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda' # 4.0.0
        with:
          composer-options: '--prefer-dist'

      - name: 'Run Rector'
        run: make run-rector

  phpunit:
    runs-on: 'ubuntu-24.04'
    name: 'PHPUnit (PHP ${{ matrix.php }}, ES ${{ matrix.elasticsearch }})'
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for the Codecov OIDC token exchange below. id-token is never
      # granted by default, so it has to be requested explicitly.
      id-token: write
    strategy:
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        dependencies:
          - 'highest'
        elasticsearch:
          - '9.5.5'
      fail-fast: false
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962' # 2.40.0
        with:
          php-version: '${{ matrix.php }}'
          coverage: 'pcov'
          tools: 'pecl, composer:v2'
          extensions: 'curl, json, mbstring, openssl'

      - name: 'Install dependencies with Composer'
        uses: 'ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda' # 4.0.0
        with:
          dependency-versions: '${{ matrix.dependencies }}'
          composer-options: '--prefer-dist'

      - name: 'Run unit tests'
        run: |
          vendor/bin/phpunit --group unit --coverage-clover=build/coverage/unit-coverage.xml

      - name: 'Setup Elasticsearch'
        env:
          ES_VERSION: "${{ matrix.elasticsearch }}"
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144
          docker compose --file=docker/compose.proxy.yaml --file=docker/compose.es.yaml up --detach

          docker run --rm --network=docker_elastic curlimages/curl --max-time 120 --retry-max-time 120 --retry 120 --retry-delay 5 --retry-all-errors --show-error --silent http://es01:9200
          docker run --rm --network=docker_elastic curlimages/curl --max-time 120 --retry-max-time 120 --retry 120 --retry-delay 5 --retry-all-errors --show-error --silent http://es02:9200

      - name: 'Run functional tests'
        env:
          ES_VERSION: "${{ matrix.elasticsearch }}"
        run: |
          vendor/bin/phpunit --group functional --coverage-clover=build/coverage/functional-coverage.xml

      - name: 'Upload coverage to Codecov'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage/unit-coverage.xml,build/coverage/functional-coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          # Tokenless uploads from forks can be flaky; only request OIDC
          # when the workflow is running on the head repository.
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

      - name: Elasticsearch Logs
        if: always()
        run: |
          docker compose --file=docker/compose.proxy.yaml --file=docker/compose.es.yaml logs es01 es02

  phpstan:
    runs-on: 'ubuntu-24.04'
    name: 'PHPStan'
    timeout-minutes: 10
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962' # 2.40.0
        with:
          php-version: '8.1'
          coverage: 'none'
          tools: 'composer:v2'
          extensions: 'curl, json, mbstring, openssl'

      - name: 'Install dependencies with Composer'
        uses: 'ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f' # 3.2.1
        with:
          composer-options: '--prefer-dist'

      - name: 'Run phpstan'
        run: |
          vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=1G
